<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Convite | Inauguração do Showroom Romini</title>
<meta name="theme-color" content="#060606">
<meta name="description" content="Você está convidado para a inauguração do novo showroom Romini em João Pessoa. 17.09, 19h.">
<meta property="og:title" content="Um convite especial — Romini Móveis Planejados">
<meta property="og:description" content="Inauguração do showroom Romini · João Pessoa · 17.09 · 19h">
<meta property="og:image" content="assets/envelope.jpg">
<link rel="preload" as="image" href="assets/envelope.jpg">
<link rel="preload" as="image" href="assets/convite.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* ───────────────────────────── base ───────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: #060606; color: #e8e6e2;
  font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
body { display: grid; place-items: center; }

.ambient {
  position: fixed; inset: -20%; pointer-events: none; z-index: 0;
  background:
    radial-gradient(58% 42% at 50% 38%, rgba(190,190,190,.09), transparent 70%),
    radial-gradient(70% 60% at 50% 100%, rgba(120,120,120,.05), transparent 70%);
  filter: blur(8px);
}

/* ───────────────────────── palco (9:16) ───────────────────────── */
.stage {
  position: relative; z-index: 1;
  width: min(100vw, calc(100dvh * 9 / 16));
  height: min(100dvh, calc(100vw * 16 / 9));
  overflow: hidden;
  opacity: 0;
}
@media (min-width: 720px) and (min-height: 720px) {
  .stage {
    width: min(calc(100vw - 48px), calc((100dvh - 48px) * 9 / 16));
    height: min(calc(100dvh - 48px), calc((100vw - 48px) * 16 / 9));
    border-radius: 14px;
    box-shadow: 0 60px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.05);
  }
}
.tilt { position: absolute; inset: 0; }

/* ─────────────────── geometria do envelope ────────────────────── */
/* medida no PDF de origem: as bordas da aba encontram as laterais em
   37,19% e 38,85%; o bico do V (onde fica o lacre) em 53,33% / 58,33% */
.scene {
  --edge-l: 37.19%;
  --edge-r: 38.85%;
  --apex-x: 53.33%;
  --apex-y: 58.33%;
  --flap-poly: polygon(0 0, 100% 0, 100% var(--edge-r), var(--apex-x) var(--apex-y), 0 var(--edge-l));
  --body-poly: polygon(0 var(--edge-l), var(--apex-x) var(--apex-y), 100% var(--edge-r), 100% 100%, 0 100%);
  position: absolute; inset: 0;
}
.layer { position: absolute; inset: 0; }

/* 1 · forro do envelope, revelado quando a aba sobe */
.interior {
  clip-path: var(--flap-poly);
  background: linear-gradient(180deg, #000 0%, #070707 50%, #101010 100%);
  z-index: 1;
}

/* 2 · o convite, guardado dentro */
.card-wrap { z-index: 2; }
.card {
  position: absolute; inset: 0;
  background: url("assets/convite.jpg") center / 100% 100% no-repeat;
  background-color: #0a0a0a;
  transform: translateY(66%) scale(.9);
  box-shadow: 0 -22px 50px -10px rgba(0,0,0,.9);
  will-change: transform;
}
.sweep {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(102deg, transparent 40%, rgba(255,255,255,.11) 50%, transparent 60%);
  background-size: 260% 100%; background-position: 120% 0;
}

/* 3 · frente do envelope — esconde o convite até ele subir */
.body {
  clip-path: var(--body-poly);
  background: url("assets/envelope.jpg") center / 100% 100% no-repeat;
  z-index: 3;
}
.body .edge { position: absolute; inset: 0; opacity: 0; }
.body .edge path {
  fill: none; stroke: rgba(255,255,255,.18); stroke-width: 2.6;
  stroke-linejoin: round; vector-effect: non-scaling-stroke;
}

/* 4 · sombra que a aba fechada projeta sobre a frente */
.flap-shadow {
  clip-path: var(--body-poly); z-index: 4; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 22%);
}

/* 5 · a luz vem da boca do envelope: tudo abaixo dela recua para a sombra */
.mouth-shade {
  z-index: 5; pointer-events: none; opacity: 0;
  background: linear-gradient(180deg,
    transparent 38%, rgba(0,0,0,.55) 54%, rgba(0,0,0,.85) 66%, rgba(0,0,0,.92) 100%);
}

/* 6 · a aba */
.flap {
  z-index: 6;
  clip-path: var(--flap-poly);
  background: url("assets/envelope.jpg") center / 100% 100% no-repeat;
  will-change: transform, opacity;
}

/* ───────────────────────── o lacre ────────────────────────────── */
.seal-btn {
  position: absolute; z-index: 8;
  left: 52.1%; top: 56.1%;
  width: 37%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border: 0; padding: 0; background: transparent; border-radius: 50%;
  cursor: pointer; -webkit-tap-highlight-color: transparent; appearance: none;
}
.seal-btn:focus-visible { outline: 1px solid rgba(255,255,255,.55); outline-offset: 10px; }
.glow {
  position: absolute; inset: -34%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,.05) 46%, transparent 68%);
  opacity: .45;
}
.ring {
  position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  border: 1px solid rgba(255,255,255,.34); opacity: 0;
}

.hint {
  position: absolute; z-index: 8; left: 0; right: 0; top: 74%;
  text-align: center; opacity: 0;
  font-size: clamp(9px, 2.4vw, 11px); letter-spacing: .30em; text-transform: uppercase;
  color: rgba(255,255,255,.40); pointer-events: none;
}

/* ───────────── áreas clicáveis sobre o convite ────────────────── */
.hotspots { position: absolute; inset: 0; z-index: 9; opacity: 0; pointer-events: none; }
.hotspots.on { pointer-events: auto; }
.hotspot {
  position: absolute; top: 68.9%; height: 10.2%; width: 15.4%;
  border-radius: 12px; display: block; -webkit-tap-highlight-color: transparent;
  transition: transform .35s cubic-bezier(.2,.7,.3,1), background-color .35s;
}
.hotspot:hover, .hotspot:focus-visible { background: rgba(255,255,255,.07); transform: translateY(-2px); outline: none; }
.hs-zap   { left: 11.1%; }
.hs-local { left: 42.2%; }
.hs-insta { left: 74.5%; }

/* ───────────────────────────── chrome ─────────────────────────── */
.chrome {
  position: absolute; z-index: 12; top: 0; left: 0; right: 0;
  display: flex; justify-content: flex-end; gap: 6px;
  padding: max(12px, env(safe-area-inset-top)) 12px 0;
  opacity: 0; pointer-events: none;
}
.chrome.on { pointer-events: auto; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.14);
  background: rgba(10,10,10,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  color: rgba(255,255,255,.6); cursor: pointer; padding: 0;
  transition: color .25s, border-color .25s;
}
.icon-btn:hover { color: #fff; border-color: rgba(255,255,255,.34); }
.icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* loader */
.loader {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
  background: #060606; transition: opacity .6s ease;
}
.loader span {
  font-size: 10px; letter-spacing: .42em; text-transform: uppercase;
  color: rgba(255,255,255,.32); animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .3 } 50% { opacity: .85 } }
.loader.done { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .loader span { animation: none } }
</style>
</head>
<body>

<div class="ambient"></div>

<main class="stage" id="stage" aria-label="Convite digital Romini">
  <div class="tilt" id="tilt">
    <div class="scene" id="scene">

      <div class="layer interior" id="interior"></div>

      <div class="layer card-wrap" id="cardWrap">
        <div class="card" id="card" role="img"
             aria-label="Convite: a Romini convida você para a inauguração do seu showroom em João Pessoa. Dia 17 de setembro, às 19 horas.">
          <div class="sweep" id="sweep"></div>
        </div>
      </div>

      <div class="layer body" id="body">
        <svg class="edge" viewBox="0 0 540 960" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 357 L288 560 L540 373"/>
        </svg>
      </div>

      <div class="layer flap-shadow" id="flapShadow"></div>
      <div class="layer mouth-shade" id="mouthShade"></div>
      <div class="layer flap" id="flap"></div>

      <button class="seal-btn" id="sealBtn" aria-label="Clique aqui para abrir o convite">
        <span class="glow" id="glow"></span>
        <span class="ring" id="ring"></span>
      </button>

      <p class="hint" id="hint">toque no lacre</p>

      <div class="hotspots" id="hotspots">
        <a class="hotspot hs-zap" id="hsZap" href="#" target="_blank" rel="noopener"
           aria-label="Confirmar presença pelo WhatsApp"></a>
        <a class="hotspot hs-local" id="hsLocal" href="#" target="_blank" rel="noopener"
           aria-label="Ver o local no mapa"></a>
        <a class="hotspot hs-insta" id="hsInsta" href="#" target="_blank" rel="noopener"
           aria-label="Abrir o Instagram da Romini"></a>
      </div>

      <div class="chrome" id="chrome">
        <button class="icon-btn" id="soundBtn" aria-label="Ativar ou desativar som">
          <svg viewBox="0 0 24 24" id="soundIcon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" aria-label="Fechar o convite">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>

    </div>
  </div>
</main>

<div class="loader" id="loader"><span>Romini</span></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIGURAÇÃO — troque os três links abaixo pelos oficiais
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  whatsapp:  "https://wa.me/5583993398397?text=" +
             encodeURIComponent("Oi! Estou confirmando a minha presença para o Showroom"),
  mapa:      "https://www.google.com/maps/search/?api=1&query=Romini+M%C3%B3veis+Planejados+Jo%C3%A3o+Pessoa",
  instagram: "https://www.instagram.com/rominiplanejados/"
};

const $ = (id) => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

$("hsZap").href   = CONFIG.whatsapp;
$("hsLocal").href = CONFIG.mapa;
$("hsInsta").href = CONFIG.instagram;

/* as camadas do envelope saem do fluxo quando o convite assume a tela —
   assim nenhuma delas pode reaparecer por cima dele */
const ENVELOPE = ["#interior", "#body", "#flapShadow", "#mouthShade", "#flap", "#sealBtn"];

/* ── som: um deslizar de papel, gerado no próprio navegador ──── */
const Sound = {
  on: true, ctx: null,
  slide() {
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.ctx, t = ctx.currentTime, dur = 1.5;
      const n = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const lp = ctx.createBiquadFilter(), g = ctx.createGain();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(520, t);
      lp.frequency.linearRampToValueAtTime(2300, t + .75);
      lp.frequency.linearRampToValueAtTime(420, t + 1.5);
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(.055, t + .45);
      g.gain.linearRampToValueAtTime(.0001, t + 1.45);
      src.connect(lp).connect(g).connect(ctx.destination); src.start(t);
    } catch (e) { /* som é opcional */ }
  }
};

/* ── repouso: o lacre respira ────────────────────────────────── */
const idle = gsap.timeline({ repeat: -1, yoyo: true, defaults: { ease: "sine.inOut" } })
  .to("#glow", { opacity: .9, scale: 1.06, duration: 2.4 }, 0);

let opened = false, tl = null;

/* ── a abertura ──────────────────────────────────────────────── */
function buildTimeline() {
  const t = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

  /* o toque */
  t.to("#sealBtn", { scale: .972, duration: .15, ease: "power2.in" }, 0)
   .to("#sealBtn", { scale: 1, duration: .55, ease: "power2.out" }, .15)
   .fromTo("#ring", { opacity: .5, scale: 1 },
                    { opacity: 0, scale: 2.1, duration: 1.15, ease: "power2.out" }, .05)
   .to("#glow", { opacity: .95, duration: .3 }, .05)
   .to("#glow", { opacity: 0, duration: .7 }, .35)
   .to("#hint", { opacity: 0, duration: .3 }, 0)

  /* a aba se ergue e se dissolve; a boca do envelope acende */
   .to("#flap", { y: "-6.5%", scale: 1.012, opacity: 0, duration: 1.0, ease: "power2.inOut" }, .38)
   .to("#flapShadow", { opacity: 0, duration: .85 }, .38)
   .to("#sealBtn", { opacity: 0, duration: .5 }, .40)
   .to(".edge", { opacity: 1, duration: .7 }, .50)
   .to("#mouthShade", { opacity: 1, duration: .8, ease: "power2.out" }, .52)

  /* movimento contrário: o convite sobe enquanto o envelope desce —
     é assim que se tira um cartão de dentro de um envelope, e é o que
     leva embora a metade do lacre que ficou na frente do envelope */
   .to("#card", { y: "0%", scale: 1, duration: 1.8, ease: "power2.out" }, .78)
   .to("#body", { y: "46%", duration: 1.5, ease: "power2.in" }, .78)
   .to("#body", { opacity: 0, duration: .8, ease: "power1.in" }, .95)
   .add(() => Sound.slide(), .76)

  /* o convite fica sozinho na tela */
   .to("#interior", { opacity: 0, duration: .7 }, 1.30)
   .to("#mouthShade", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 1.55)
   .to("#card", { boxShadow: "0 0px 0px 0px rgba(0,0,0,0)", duration: .8 }, 1.7)
   .fromTo("#sweep", { opacity: 0, backgroundPosition: "120% 0" },
                     { opacity: 1, backgroundPosition: "-40% 0", duration: 1.3, ease: "power2.inOut" }, 2.05)
   .to("#sweep", { opacity: 0, duration: .5 }, 3.10)
   .to("#hotspots", { opacity: 1, duration: .7 }, 2.55)
   .to("#chrome", { opacity: 1, duration: .7 }, 2.70)

   .add(() => {
      /* estado final: só o convite continua na tela */
      gsap.set(ENVELOPE, { display: "none" });
      gsap.set("#card", { y: "0%", scale: 1, boxShadow: "none" });
      $("hotspots").classList.add("on");
      $("chrome").classList.add("on");
   });

  return t;
}

function open(instant) {
  if (opened) return;
  opened = true;
  idle.kill();
  gsap.killTweensOf("#hint");
  gsap.set("#hint", { opacity: 0 });
  tl = buildTimeline();
  if (instant || reduced) tl.progress(1); else tl.play();
  if (location.hash !== "#convite") history.pushState({ v: "convite" }, "", "#convite");
}

function close() {
  if (!opened) return;
  gsap.to("#stage", {
    opacity: 0, duration: .4, onComplete: () => {
      opened = false;
      if (tl) { tl.kill(); tl = null; }
      resetScene();
      gsap.to("#stage", { opacity: 1, duration: .6 });
      idle.restart();
    }
  });
  if (location.hash === "#convite") history.replaceState({}, "", location.pathname + location.search);
}

function resetScene() {
  gsap.set(ENVELOPE, { clearProps: "display" });
  gsap.set("#flap", { y: "0%", scale: 1, opacity: 1 });
  gsap.set("#flapShadow", { opacity: 1 });
  gsap.set("#mouthShade", { opacity: 0 });
  gsap.set("#interior", { opacity: 1 });
  gsap.set("#body", { y: "0%", opacity: 1 });
  gsap.set(".edge", { opacity: 0 });
  gsap.set("#card", { y: "66%", scale: .9, boxShadow: "0 -22px 50px -10px rgba(0,0,0,.9)" });
  gsap.set("#sealBtn", { opacity: 1, scale: 1 });
  gsap.set("#glow", { opacity: .45, scale: 1 });
  gsap.set("#ring", { opacity: 0, scale: 1 });
  gsap.set("#sweep", { opacity: 0 });
  gsap.set("#hotspots", { opacity: 0 });
  gsap.set("#chrome", { opacity: 0 });
  $("hotspots").classList.remove("on");
  $("chrome").classList.remove("on");
  gsap.to("#hint", { opacity: 1, duration: 1, delay: 2.2 });
}

$("sealBtn").addEventListener("click", () => open(false));
$("resetBtn").addEventListener("click", close);
$("soundBtn").addEventListener("click", () => {
  Sound.on = !Sound.on;
  $("soundIcon").style.opacity = Sound.on ? 1 : .4;
});
addEventListener("popstate", () => { if (location.hash !== "#convite") close(); });

/* ── paralaxe discreta, só no desktop e só em 2D ─────────────── */
if (!reduced && matchMedia("(hover: hover)").matches) {
  const qx = gsap.quickTo("#tilt", "x", { duration: 1, ease: "power3.out" });
  const qy = gsap.quickTo("#tilt", "y", { duration: 1, ease: "power3.out" });
  addEventListener("pointermove", (e) => {
    if (opened) { qx(0); qy(0); return; }
    const r = $("stage").getBoundingClientRect();
    qx(((e.clientX - r.left) / r.width - .5) * 10);
    qy(((e.clientY - r.top) / r.height - .5) * 7);
  });
}

/* ── carregamento ───────────────────────────────────────────── */
const preload = (src) => new Promise((res) => {
  const i = new Image(); i.onload = i.onerror = res; i.src = src;
});

Promise.all([preload("assets/envelope.jpg"), preload("assets/convite.jpg")]).then(() => {
  $("loader").classList.add("done");
  setTimeout(() => $("loader").remove(), 700);
  resetScene();
  gsap.to("#stage", { opacity: 1, duration: 1.1, ease: "power2.out" });
  if (location.hash === "#convite") open(true);
});
</script>
</body>
</html>
